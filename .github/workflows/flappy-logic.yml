name: Flappy Madruga logic compiler

on:
  push:
    branches:
      - main
      - docs/executable-runtime-roadmap
    paths:
      - "Cargo.toml"
      - "crates/impossible-runtime/**"
      - "impossible/**"
      - "projects/flappy-ramon/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/flappy-logic.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/impossible-runtime/**"
      - "impossible/**"
      - "projects/flappy-ramon/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/flappy-logic.yml"

permissions:
  contents: read

jobs:
  headless-project-compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate pinned Flappy source and native project
        run: |
          python -m impossible.compiler validate \
            --project projects/flappy-ramon/Flappy-Madruga.ieproj \
            --target logic

      - name: Compile the headless Rust motor
        run: |
          python -m impossible.compiler compile \
            --project projects/flappy-ramon/Flappy-Madruga.ieproj \
            --target logic

      - name: Run editor, registry and importer tests
        run: python -m unittest discover -s tests -v
