name: Flappy Madruga native Rust checks

on:
  push:
    paths:
      - "projects/flappy-ramon/**"
      - ".github/workflows/flappy-madruga-rust.yml"
  pull_request:
    paths:
      - "projects/flappy-ramon/**"
      - ".github/workflows/flappy-madruga-rust.yml"
  workflow_dispatch:

jobs:
  native-rust:
    name: Test and build the first Impossible game
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native window/audio development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run gameplay and geometry tests
        run: cargo test --manifest-path projects/flappy-ramon/Cargo.toml

      - name: Build native desktop executable
        run: cargo build --release --manifest-path projects/flappy-ramon/Cargo.toml
