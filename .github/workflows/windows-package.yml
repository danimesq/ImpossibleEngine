name: Windows portable package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-gettext
      - name: Build portable Windows ZIP
        run: python pack/windows/build_portable.py
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: impossible-engine-windows-x86_64
          path: dist/ImpossibleEngine-*-windows-x86_64-portable.zip
          if-no-files-found: error
          retention-days: 14
