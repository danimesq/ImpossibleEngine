name: Windows GitHub Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-gettext
      - name: Build portable Windows ZIP
        run: python pack/windows/build_portable.py
      - name: Publish GitHub Release asset
        if: startsWith(github.ref, "refs/tags/")
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/ImpossibleEngine-*-windows-x86_64-portable.zip
      - name: Upload manual build artifact
        if: github.event_name == "workflow_dispatch"
        uses: actions/upload-artifact@v4
        with:
          name: impossible-engine-windows-x86_64
          path: dist/ImpossibleEngine-*-windows-x86_64-portable.zip
          if-no-files-found: error
