[package]
name = "flappy-madruga"
version = "0.1.0"
edition = "2021"
publish = false
description = "Flappy Madruga gameplay compiled by ImpossibleEngine"

[lib]
path = "src/lib.rs"

[[bin]]
name = "flappy-madruga"
path = "src/main.rs"
required-features = ["graphics"]

[package.metadata.android]
assets = "assets"

[features]
default = []
# Legacy Macroquad display/audio host. The ImpossibleEngine logic target stays headless.
graphics = ["dep:macroquad", "dep:quad-storage"]

[dependencies]
impossible-runtime = { path = "../../crates/impossible-runtime" }
macroquad = { version = "=0.4.16", features = ["audio"], optional = true }
quad-storage = { version = "=0.1.3", optional = true }
