[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impossible-engine"
version = "0.1.0.dev0"
description = "Rust-first visual game authoring prototype with GTK 3 Event Sheets"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
impossible = "impossible.app:main"

[tool.setuptools.package-data]
impossible = ["ui/*.ui", "ui/*.css"]
